[project]
name = "knowledge-tree"
version = "0.5.0"
description = "Knowledge Tree: local-first RAG over a git-backed markdown knowledge base (LanceDB local, Qdrant on k8s), served as the kb API and MCP."
requires-python = ">=3.11"
# Runtime dependencies of the ghcr.io/teaglebuilt/kb image (API, read MCP,
# sync job). The Dockerfile installs exactly these from uv.lock.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "mcp[cli]>=2.3",
    "qdrant-client>=1.12",
    "fastembed>=0.4",
    "lancedb>=0.25.3",
    "pyyaml>=6.0",
    # Newest releases of these dropped macOS x86_64 wheels; cap until this
    # machine moves to arm64, otherwise `uv sync` cannot resolve at all.
    "onnxruntime<1.24",
]

[dependency-groups]
# Local indexing pipeline (extract / ingest / query); not in the image.
pipeline = [
    "duckdb>=1.1",
    "jinja2>=3.1",
    "tantivy>=0.22",       # enables LanceDB full-text (BM25) index for hybrid search
    "ebooklib>=0.18",      # epub reader (spine -> XHTML) for source extraction
    "markdownify>=0.13",   # epub XHTML -> heading-preserving markdown
    "pymupdf4llm>=0.0.17",  # pdf -> markdown (prose books/papers)
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.uv]
default-groups = ["dev", "pipeline"]

[tool.kb]
# Root(s) holding ingestable markdown — the Obsidian vault lives under `tree/`.
knowledge_dirs = ["tree"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kb"]
