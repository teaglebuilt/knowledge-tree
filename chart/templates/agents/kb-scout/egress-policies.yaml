{{- if .Values.knowledgeScoutAgent.enabled }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: EgressPolicy
metadata:
  name: {{ .Values.knowledgeScoutAgent.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.knowledgeScoutAgent.name }}
    app.kubernetes.io/part-of: knowledge-tree
spec:
  destinations:
    {{- range .Values.knowledgeScoutAgent.egressOrigins }}
    - origin: {{ . }}
    {{- end }}
{{- end }}
