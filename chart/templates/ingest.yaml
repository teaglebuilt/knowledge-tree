{{- if .Values.ingest.enabled }}
{{- $name := .Values.ingest.name }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: knowledge-tree
    app.kubernetes.io/component: ingest
spec:
  replicas: {{ .Values.ingest.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: knowledge-tree
        app.kubernetes.io/component: ingest
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ingest
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "kb.ingest_api"]
          ports:
            - name: http
              containerPort: {{ .Values.ingest.port }}
              protocol: TCP
          env:
            - name: QDRANT_NETWORK
              value: {{ .Values.qdrant.network | quote }}
            - name: QDRANT_INTERNAL_URL
              value: {{ .Values.qdrant.internalUrl | quote }}
            - name: QDRANT_EXTERNAL_URL
              value: {{ .Values.qdrant.externalUrl | quote }}
            {{- if .Values.qdrant.url }}
            - name: QDRANT_URL
              value: {{ .Values.qdrant.url | quote }}
            {{- end }}
            {{- if .Values.qdrant.verify }}
            - name: QDRANT_VERIFY
              value: {{ .Values.qdrant.verify | quote }}
            {{- end }}
            {{- if and (not .Values.qdrant.existingSecretEnabled) .Values.qdrant.apikey }}
            - name: QDRANT_API_KEY
              value: {{ .Values.qdrant.apikey | quote }}
            {{- end }}
            - name: COLLECTION_NAME
              value: {{ .Values.qdrant.collection | quote }}
            - name: EMBEDDING_MODEL
              value: {{ .Values.embedding.model | quote }}
            - name: KB_INGEST_PORT
              value: {{ .Values.ingest.port | quote }}
            - name: KB_INGEST_PATH_PREFIXES
              value: {{ .Values.ingest.pathPrefixes | quote }}
            {{- if .Values.ingest.tokenSecret }}
            - name: KB_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ingest.tokenSecret | quote }}
                  key: {{ .Values.ingest.tokenSecretKey | quote }}
            {{- end }}
            - name: HOME
              value: /home/mcp
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: FASTEMBED_CACHE_PATH
              value: {{ .Values.fastembedCachePath | quote }}
          {{- if and .Values.qdrant.existingSecretEnabled .Values.qdrant.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.qdrant.existingSecret | quote }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: home
              mountPath: /home/mcp
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.ingest.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      volumes:
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: knowledge-tree
    app.kubernetes.io/component: ingest
  {{- with .Values.ingest.serviceAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ .Values.ingest.port }}
      targetPort: http
      protocol: TCP
{{- end }}
