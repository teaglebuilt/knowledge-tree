{{- if .Values.mcp.read.enabled }}
apiVersion: {{ .Values.mcp.read.apiVersion }}
kind: MCPServer
metadata:
  name: {{ .Values.mcp.read.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.mcp.read.name }}
    app.kubernetes.io/part-of: knowledge-tree
    app.kubernetes.io/component: mcp-read
spec:
  transportType: {{ .Values.mcp.read.transportType }}
  stdioTransport: {}
  timeout: {{ .Values.mcp.read.timeout | quote }}
  deployment:
    image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
    imagePullPolicy: {{ .Values.image.pullPolicy }}
    {{- with .Values.image.pullSecrets }}
    imagePullSecrets:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    port: {{ .Values.mcp.read.port }}
    replicas: {{ .Values.mcp.read.replicas }}
    cmd: {{ .Values.mcp.read.cmd | quote }}
    args:
      {{- toYaml .Values.mcp.read.args | nindent 6 }}
    env:
      QDRANT_NETWORK: {{ .Values.qdrant.network | quote }}
      QDRANT_INTERNAL_URL: {{ .Values.qdrant.internalUrl | quote }}
      QDRANT_EXTERNAL_URL: {{ .Values.qdrant.externalUrl | quote }}
      {{- if .Values.qdrant.url }}
      QDRANT_URL: {{ .Values.qdrant.url | quote }}
      {{- end }}
      {{- if .Values.qdrant.verify }}
      QDRANT_VERIFY: {{ .Values.qdrant.verify | quote }}
      {{- end }}
      {{- if and (not .Values.qdrant.existingSecretEnabled) .Values.qdrant.apikey }}
      QDRANT_API_KEY: {{ .Values.qdrant.apikey | quote }}
      {{- end }}
      COLLECTION_NAME: {{ .Values.qdrant.collection | quote }}
      EMBEDDING_MODEL: {{ .Values.embedding.model | quote }}
      KB_SEARCH_DEFAULT_K: {{ .Values.search.defaultK | quote }}
      KB_SEARCH_MAX_K: {{ .Values.search.maxK | quote }}
      OTEL_SERVICE_NAME: {{ .Values.mcp.read.name | quote }}
      HOME: /home/mcp
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      FASTEMBED_CACHE_PATH: {{ .Values.fastembedCachePath | quote }}
    {{- if and .Values.qdrant.existingSecretEnabled .Values.qdrant.existingSecret }}
    secretRefs:
      - name: {{ .Values.qdrant.existingSecret | quote }}
    {{- end }}
    volumeMounts:
      {{- if .Values.writableVolumes.home }}
      - name: home
        mountPath: /home/mcp
      {{- end }}
      {{- if .Values.writableVolumes.tmp }}
      - name: tmp
        mountPath: /tmp
      {{- end }}
    volumes:
      {{- if .Values.writableVolumes.home }}
      - name: home
        emptyDir: {}
      {{- end }}
      {{- if .Values.writableVolumes.tmp }}
      - name: tmp
        emptyDir: {}
      {{- end }}
    resources:
      {{- toYaml .Values.resources | nindent 6 }}
    podSecurityContext:
      {{- toYaml .Values.podSecurityContext | nindent 6 }}
    securityContext:
      {{- toYaml .Values.securityContext | nindent 6 }}
---
# Registration agents bind in `tools:` (the MCPServer above only runs the pod).
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: {{ .Values.mcp.read.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.mcp.read.name }}
    app.kubernetes.io/part-of: knowledge-tree
    app.kubernetes.io/component: mcp-read
spec:
  description: >-
    Knowledge-tree read MCP (kb_search, kb_get_document -> Qdrant collection
    {{ .Values.qdrant.collection }}). Read-only; writes live on kb-mcp-write.
    Server is owned by teaglebuilt/knowledge.
  protocol: STREAMABLE_HTTP
  url: "http://{{ .Values.mcp.read.name }}.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.mcp.read.port }}/mcp"
  timeout: {{ .Values.mcp.read.timeout | quote }}
{{- end }}
