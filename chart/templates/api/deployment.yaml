{{- if .Values.api.enabled }}
{{- $name := .Values.api.name }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: knowledge-tree
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: knowledge-tree
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "kb.api"]
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          env:
            - name: QDRANT_NETWORK
              value: {{ .Values.qdrant.network | quote }}
            - name: QDRANT_INTERNAL_URL
              value: {{ .Values.qdrant.internalUrl | quote }}
            - name: QDRANT_EXTERNAL_URL
              value: {{ .Values.qdrant.externalUrl | quote }}
            {{- if .Values.qdrant.url }}
            - name: QDRANT_URL
              value: {{ .Values.qdrant.url | quote }}
            {{- end }}
            {{- if .Values.qdrant.verify }}
            - name: QDRANT_VERIFY
              value: {{ .Values.qdrant.verify | quote }}
            {{- end }}
            {{- if and (not .Values.qdrant.existingSecretEnabled) .Values.qdrant.apikey }}
            - name: QDRANT_API_KEY
              value: {{ .Values.qdrant.apikey | quote }}
            {{- end }}
            - name: COLLECTION_NAME
              value: {{ .Values.qdrant.collection | quote }}
            - name: EMBEDDING_MODEL
              value: {{ .Values.embedding.model | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ $name | quote }}
            - name: KB_API_PORT
              value: {{ .Values.api.port | quote }}
            - name: KB_API_WRITE_PATH_PREFIXES
              value: {{ .Values.api.writePolicy.pathPrefixes | quote }}
            - name: KB_MCP_WRITE_PATH_PREFIXES
              value: {{ .Values.api.mcpWrite.pathPrefixes | quote }}
            - name: KB_MCP_WRITE_SOURCE_TYPES
              value: {{ .Values.api.mcpWrite.sourceTypes | quote }}
            - name: KB_MCP_WRITE_MAX_BYTES
              value: {{ .Values.api.mcpWrite.maxBytes | quote }}
            - name: KB_MCP_WRITE_LEGACY_TOOLS
              value: {{ .Values.api.mcpWrite.legacyTools | quote }}
            {{- with .Values.api.auth }}
            {{- if .writeTokenSecret }}
            - name: KB_API_WRITE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .writeTokenSecret | quote }}
                  key: {{ .writeTokenSecretKey | quote }}
            {{- end }}
            {{- if .readTokenSecret }}
            - name: KB_API_READ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .readTokenSecret | quote }}
                  key: {{ .readTokenSecretKey | quote }}
            {{- end }}
            {{- if .adminTokenSecret }}
            - name: KB_API_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .adminTokenSecret | quote }}
                  key: {{ .adminTokenSecretKey | quote }}
            {{- end }}
            {{- end }}
            - name: HOME
              value: /home/mcp
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: FASTEMBED_CACHE_PATH
              value: {{ .Values.fastembedCachePath | quote }}
          {{- if and .Values.qdrant.existingSecretEnabled .Values.qdrant.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.qdrant.existingSecret | quote }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: home
              mountPath: /home/mcp
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      volumes:
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}
