# knowledge-tree chart — kb-mcp-read, kb-api (+ kb-mcp-write), kb sync, and the kagent agents.
# Values layout changed in chart 3.0.0: mcpServer.* -> mcp.read.*, ingest.* ->
# api.*, docsAgent.kbIngest.* -> docsAgent.kbWriter.* (docs/api.md#migration).
# values.schema.json rejects the old keys so a stale overlay fails loudly.

# Namespace for MCPServer / Agent CRs (kagent lives in `ai` on mlops).
namespace: ai

# One image for every mode (read MCP, API, sync). Publish with make docker-push.
image:
  repository: ghcr.io/teaglebuilt/kb
  tag: "0.5.0"
  pullPolicy: IfNotPresent
  pullSecrets:
    - name: ghcr-secret

mcp:
  # kb-mcp-read: kb_search + kb_get_document only. Runs on mlops next to kagent.
  read:
    enabled: true
    name: kb-mcp-read
    # kagent MCPServer CR apiVersion (stdio stdioTransport).
    apiVersion: kagent.dev/v1alpha1
    transportType: stdio
    timeout: 120s
    replicas: 1
    port: 3000
    # Explicit cmd so the CR does not rely solely on image ENTRYPOINT.
    cmd: python
    args:
      - -m
      - kb.mcp

# kb-api: /v1 REST + /openapi.json, and kb-mcp-write at /mcp. Install it in the
# cluster that hosts Qdrant and its HTTP callers (application).
api:
  enabled: false
  name: kb-api
  replicas: 1
  port: 3000
  writePolicy:
    # Comma-separated path prefixes HTTP writers may own. Must stay DISJOINT
    # from paths `kb sync` owns: n8n YouTube writes tree/youtube/, agents
    # write tree/docs/.
    pathPrefixes: "tree/youtube/,tree/docs/"
  # Agent-facing write MCP (/mcp on the same Service): kb_store_document +
  # kb_document_status. Narrower than HTTP: own prefix, closed source types,
  # size cap, mandatory source_url.
  mcpWrite:
    pathPrefixes: "tree/docs/"
    sourceTypes: "documentation"
    maxBytes: "524288"
    # Also serve kb_ingest / kb_ingest_status while agents migrate.
    legacyTools: true
  auth:
    # NAME of a Secret (chart namespace) holding the write token, not the
    # token itself. REQUIRED: with no write token the API refuses every write.
    # Create: kubectl -n ai create secret generic kb-api-write-token \
    #           --from-literal=KB_API_WRITE_TOKEN=<random>
    # Migrating in place? Point this at the old kb-ingest-token Secret and set
    # writeTokenSecretKey: KB_INGEST_TOKEN.
    writeTokenSecret: kb-api-write-token
    writeTokenSecretKey: KB_API_WRITE_TOKEN
    # Optional. Set to require a token for reads (/v1/search, /v1/documents*).
    readTokenSecret: ""
    readTokenSecretKey: KB_API_READ_TOKEN
    # Optional. Set to split DELETE from the write token.
    adminTokenSecret: ""
    adminTokenSecretKey: KB_API_ADMIN_TOKEN
  # Global so the mlops kagent agents can reach kb-api through Cilium.
  serviceAnnotations:
    service.cilium.io/global: "true"
    service.cilium.io/shared: "true"
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

# `kb sync` as a Helm post-install/upgrade Job: LanceDB on S3 -> Qdrant.
# Publish the index first from the laptop: KB_LANCEDB=s3://... make ingest reindex
sync:
  enabled: false
  name: kb-sync
  backoffLimit: 2
  lancedbUri: s3://knowledge/lancedb
  s3:
    endpoint: http://seaweedfs-s3.storage.svc:8333
    region: us-east-1
    allowHttp: "true"
    # Secret in the chart namespace holding the bucket credentials.
    existingSecret: kb-s3
    accessKeyIdKey: AWS_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

qdrant:
  network: internal
  internalUrl: http://qdrant.data.svc.cluster.local:6333
  externalUrl: https://qdrant.homelab.internal
  apikey: ""
  # Optional hard override (wins over network mode when set).
  url: ""
  # Empty → kb.config defaults (verify=true for internal HTTP, false for external TLS).
  verify: ""
  collection: knowledge
  # Secret in the chart namespace; keys become env vars. Expects key QDRANT_API_KEY.
  existingSecretEnabled: true
  existingSecret: mcp-secrets

embedding:
  model: BAAI/bge-small-en-v1.5

search:
  defaultK: "8"
  maxK: "20"

# Baked FastEmbed cache path inside the image (do not mount emptyDir over this).
fastembedCachePath: /opt/fastembed

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true

# emptyDir mounts for writable paths when root FS is read-only.
# Model weights stay at fastembedCachePath (image layer); HOME is for runtime only.
writableVolumes:
  home: true
  tmp: true

knowledgeScoutAgent:
  # knowledge-scout Agent (chart/templates/agents/kb-scout/) — enable when ready.
  enabled: true
  # Agent and EgressPolicy name (the Agent references its policy by this name).
  name: knowledge-scout-agent
  # Read-only: no kb-api origin, so the scout cannot reach the writer even by URL.
  egressOrigins:
    - http://kb-mcp-read.ai.svc.cluster.local:3000
    - http://firecrawl-mcp.automation.svc.cluster.local:3000
    - https://mcp.context7.com
    - http://vllm-selfhosted.ai.svc.cluster.local:8000

# Documentation agent: harvests whole documentation sets into tree/docs/.
# Gated by docsAgent.enabled alone. Deploy with kagent on mlops; set false on
# any cluster without kagent CRDs (e.g. application).
# Bound as a subAgent by homelab solutions-architect (conversation hand-off).
docsAgent:
  enabled: true
  templateName: documentation
  name: documentation-agent
  modelConfig: llmd-vllm-config
  # Pages scraped+ingested per run. Every page passes through the model's
  # context (scrape result + kb_store_document args), so keep this small on 32k models.
  maxPagesPerRun: 8
  # Requires the kagent harness with the golang-adk image (homelab harness
  # `kagent` uses it). Set false on codex/claude/byo harnesses, which reject it.
  structuredOutput: true
  # RemoteMCPServer for the write MCP. kb-api runs on the cluster that hosts
  # Qdrant; the Cilium global Service makes this DNS name resolve on mlops.
  kbWriter:
    createRemoteMCPServer: true
    name: kb-mcp-write
    url: http://kb-api.ai.svc.cluster.local:3000/mcp
    timeout: 120s
    # Secret IN THE AGENT NAMESPACE (mlops/ai) holding the same token as the
    # kb-api Deployment's KB_API_WRITE_TOKEN. Sent as tokenHeader.
    tokenSecret: kb-api-write-token
    tokenSecretKey: KB_API_WRITE_TOKEN
    tokenHeader: X-KB-Write-Token
  # Explicit egress (inferred policy alone does not reach actors — homelab
  # solutions-architect learned this the hard way).
  egressOrigins:
    - http://kb-mcp-read.ai.svc.cluster.local:3000
    - http://kb-api.ai.svc.cluster.local:3000
    - http://firecrawl-mcp.automation.svc.cluster.local:3000
    - https://mcp.context7.com
    - http://vllm-selfhosted.ai.svc.cluster.local:8000
