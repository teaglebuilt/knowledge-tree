# knowledge-tree chart — kb-retrieval MCPServer + knowledge-scout Agent

# Namespace for MCPServer / Agent CRs (kagent lives in `ai` on mlops).
namespace: ai

# TODO: publish the image (make docker-push) before cluster deploy.
# Placeholder registry path — replace if your org uses a different GHCR/name.
image:
  repository: ghcr.io/teaglebuilt/kb-retrieval
  tag: "0.4.0"
  pullPolicy: IfNotPresent
  pullSecrets:
    - name: ghcr-secret

mcpServer:
  enabled: true
  name: kb-retrieval
  # kagent MCPServer CR apiVersion (stdio stdioTransport).
  apiVersion: kagent.dev/v1alpha1
  transportType: stdio
  timeout: 120s
  replicas: 1
  port: 3000
  # Explicit cmd so the CR does not rely solely on image ENTRYPOINT.
  cmd: python
  args:
    - -m
    - kb.mcp

# Qdrant connection. When url is empty, QDRANT_NETWORK selects internal vs external.
# Prefer network=internal for in-cluster DNS (pod near Qdrant on application/data).
# Write plane (POST /ingest -> chunk -> embed -> Qdrant). Install this in the
# cluster that hosts Qdrant and the callers; see chart/README for the split.
ingest:
  enabled: false
  name: kb-ingest
  replicas: 1
  port: 3000
  # Comma-separated path prefixes the write plane is allowed to own. Must stay
  # DISJOINT from paths `kb sync` owns (docs/read-plane.md follow-up 2):
  # n8n YouTube writes tree/youtube/, agents write tree/docs/.
  pathPrefixes: "tree/youtube/,tree/docs/"
  # Agent-facing MCP (/mcp on the same Service): kb_ingest + kb_ingest_status.
  # Narrower than the HTTP plane: own prefix, closed source types, size cap.
  mcp:
    pathPrefixes: "tree/docs/"
    sourceTypes: "documentation"
    maxBytes: "524288"
  # NAME of a Secret (in the chart namespace) holding the bearer token under
  # tokenSecretKey. Not the token itself. REQUIRED: with no token the write
  # plane refuses every write (fail closed; KB_INGEST_ALLOW_ANONYMOUS is for
  # local dev only).
  # Create: kubectl -n ai create secret generic kb-ingest-token \
  #           --from-literal=KB_INGEST_TOKEN=<random>
  tokenSecret: "kb-ingest-token"
  tokenSecretKey: KB_INGEST_TOKEN
  # Global so the mlops front door (homelab apps/kb-ingest/mesh) routes here.
  serviceAnnotations:
    service.cilium.io/global: "true"
    service.cilium.io/shared: "true"
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

# `kb sync` as a Helm post-install/upgrade Job: LanceDB on S3 -> Qdrant.
# Publish the index first from the laptop: KB_LANCEDB=s3://... make ingest reindex
sync:
  enabled: false
  name: kb-sync
  backoffLimit: 2
  lancedbUri: s3://knowledge/lancedb
  s3:
    endpoint: http://seaweedfs-s3.storage.svc:8333
    region: us-east-1
    allowHttp: "true"
    # Secret in the chart namespace holding the bucket credentials.
    existingSecret: kb-s3
    accessKeyIdKey: AWS_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

qdrant:
  network: internal
  internalUrl: http://qdrant.data.svc.cluster.local:6333
  externalUrl: https://qdrant.homelab.internal
  apikey: ""
  # Optional hard override (wins over network mode when set).
  url: ""
  # Empty → kb.config defaults (verify=true for internal HTTP, false for external TLS).
  verify: ""
  collection: knowledge
  # Secret in the chart namespace; keys become env vars. Expects key QDRANT_API_KEY.
  existingSecretEnabled: true
  existingSecret: mcp-secrets

embedding:
  model: BAAI/bge-small-en-v1.5

search:
  defaultK: "8"
  maxK: "20"

# Baked FastEmbed cache path inside the image (do not mount emptyDir over this).
fastembedCachePath: /opt/fastembed

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true

# emptyDir mounts for writable paths when root FS is read-only.
# Model weights stay at fastembedCachePath (image layer); HOME is for runtime only.
writableVolumes:
  home: true
  tmp: true

knowledgeScoutAgent:
  # knowledge-scout Agent (chart/templates/agents/kb-scout/) — enable when ready.
  enabled: true
  # Agent and EgressPolicy name (the Agent references its policy by this name).
  name: knowledge-scout-agent
  egressOrigins:
    - http://kb-retrieval.ai.svc.cluster.local:3000
    - http://kb-ingest.ai.svc.cluster.local:3000
    - http://firecrawl-mcp.automation.svc.cluster.local:3000
    - https://mcp.context7.com
    - http://vllm-selfhosted.ai.svc.cluster.local:8000

# Documentation agent: harvests whole documentation sets into tree/docs/.
# Gated by docsAgent.enabled alone. Deploy with kagent on mlops; set false on
# any cluster without kagent CRDs (e.g. application).
# Bound as a subAgent by homelab solutions-architect (conversation hand-off).
docsAgent:
  enabled: true
  templateName: documentation
  name: documentation-agent
  modelConfig: llmd-vllm-config
  # Pages scraped+ingested per run. Every page passes through the model's
  # context (scrape result + kb_ingest args), so keep this small on 32k models.
  maxPagesPerRun: 8
  # Requires the kagent harness with the golang-adk image (homelab harness
  # `kagent` uses it). Set false on codex/claude/byo harnesses, which reject it.
  structuredOutput: true
  # RemoteMCPServer for the write plane. kb-ingest runs on the cluster that
  # hosts Qdrant; the Cilium global Service makes this DNS name resolve on mlops.
  kbIngest:
    createRemoteMCPServer: true
    name: kb-ingest
    url: http://kb-ingest.ai.svc.cluster.local:3000/mcp
    timeout: 120s
    # Secret IN THE AGENT NAMESPACE (mlops/ai) holding the same token as the
    # kb-ingest Deployment's KB_INGEST_TOKEN. Sent as X-KB-Ingest-Token.
    tokenSecret: kb-ingest-token
    tokenSecretKey: KB_INGEST_TOKEN
  # Explicit egress (inferred policy alone does not reach actors — homelab
  # solutions-architect learned this the hard way).
  egressOrigins:
    - http://kb-retrieval.ai.svc.cluster.local:3000
    - http://kb-ingest.ai.svc.cluster.local:3000
    - http://firecrawl-mcp.automation.svc.cluster.local:3000
    - https://mcp.context7.com
    - http://vllm-selfhosted.ai.svc.cluster.local:8000
